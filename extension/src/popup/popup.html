<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FLC</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <h1>FLC</h1>
      <p class="subtitle">Foreign Language Companion</p>
    </header>

    <div id="extension-notice" class="notice-banner hidden"></div>

    <nav class="tabs">
      <button type="button" data-tab="lookup" class="active">Tra từ</button>
      <button type="button" data-tab="vocab">Từ của tôi</button>
      <button type="button" data-tab="media">Media</button>
      <button type="button" data-tab="quiz">Quiz</button>
    </nav>

    <section id="auth-panel" class="panel">
      <h2>Đăng nhập</h2>
      <p class="muted">Chỉ tài khoản Google có email trong allowlist mới dùng được.</p>
      <button type="button" id="btn-google-login" class="google-btn">
        <span class="google-icon">G</span>
        Đăng nhập bằng Google
      </button>
      <p id="auth-error" class="error"></p>
    </section>

    <section id="lookup-panel" class="panel tab-panel">
      <div class="row">
        <input id="lookup-input" type="text" placeholder="Nhập từ tiếng Anh..." />
        <button type="button" id="btn-lookup">Tra</button>
      </div>
      <div id="lookup-result" class="card hidden"></div>
      <button type="button" id="btn-save-word" class="primary hidden">Lưu từ</button>
      <p id="lookup-error" class="error"></p>
    </section>

    <section id="vocab-panel" class="panel tab-panel hidden">
      <ul id="vocab-list"></ul>
      <p id="vocab-empty" class="muted">Chưa có từ nào.</p>
    </section>

    <section id="media-panel" class="panel tab-panel hidden">
      <form id="media-form" class="card">
        <input name="title" placeholder="Tiêu đề (tự điền trên tab YouTube)" required />
        <input name="url" type="url" placeholder="URL YouTube / audio (tự điền trên tab YouTube)" required />
        <select name="type">
          <option value="youtube">YouTube</option>
          <option value="audio">Audio URL (nhắc nghe)</option>
        </select>
        <select name="frequency">
          <option value="daily">Nghe hàng ngày</option>
          <option value="weekly">Hàng tuần</option>
          <option value="monthly">Hàng tháng</option>
        </select>
        <button type="submit">Thêm link</button>
        <button type="button" id="btn-prefill-youtube" class="secondary">Lấy từ tab YouTube</button>
        <p id="media-form-status" class="muted"></p>
      </form>
      <ul id="media-list"></ul>
      <div id="listening-quiz-area" class="card hidden"></div>
    </section>

    <section id="quiz-panel" class="panel tab-panel hidden">
      <div id="quiz-area" class="card">
        <p class="muted">Quiz từ vựng — bấm "Lấy câu hỏi" hoặc mở từ thông báo. Listening quiz: tab Media → chọn Quiz/Test/Exam.</p>
        <button type="button" id="btn-next-quiz">Lấy câu hỏi</button>
      </div>
    </section>

    <footer>
      <span id="user-label"></span>
      <a href="#" id="open-options">Cài đặt</a>
      <button type="button" id="btn-logout" class="link hidden">Đăng xuất</button>
    </footer>
    <script type="module" src="popup.js"></script>
  </body>
</html>
